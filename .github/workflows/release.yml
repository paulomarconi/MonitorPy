name: Release

# Runs when a version tag is pushed (e.g. `git tag v1.0.4 && git push origin v1.0.4`).
# Regular commits to master are unaffected - this never runs on an ordinary push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload the exe

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -m "not hardware"

      - name: Build with PyInstaller
        run: pyinstaller MonitorPy.spec

      - name: Create release and attach MonitorPy.exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MonitorPy.exe
          generate_release_notes: true
