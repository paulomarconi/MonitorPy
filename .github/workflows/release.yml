name: Release

# Runs when a version tag is pushed (e.g. `git tag v1.0.4 && git push origin v1.0.4`).
# Regular commits to master are unaffected - this never runs on an ordinary push.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload the exe

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # v1.0.6 shipped saying "v1.0.5" in the tray because __version__ was not bumped.
      - name: Check the tag matches monitorpy.__version__
        shell: bash
        run: |
          version=$(python -c "import monitorpy; print(monitorpy.__version__)")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match monitorpy.__version__ ($version). Bump monitorpy/__init__.py, then delete and re-push the tag."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -m "not hardware"

      - name: Build with PyInstaller
        run: pyinstaller MonitorPy.spec

      - name: Create release and attach MonitorPy.exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MonitorPy.exe
          generate_release_notes: true
